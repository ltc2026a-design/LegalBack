# Infraestructura del backend en Render (Blueprint). Se edita aqui y se aplica
# desde el panel de Render -> New -> Blueprint.
services:
  - type: web
    name: legal-back
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/ltc2026a-design/LegalBack
    rootDir: .
    branch: main
    # El prefijo NODE_ENV=development es obligatorio: Render arranca con NODE_ENV=production
    # y npm omite entonces las devDependencies, donde viven los @types/* (express, cors,
    # jsonwebtoken, web-push, node-cron). Sin esas definiciones `tsc` no compila y no nace
    # dist/, aunque prisma y typescript aparezcan por transitividad de @prisma/client.
    buildCommand: >-
      NODE_ENV=development npm ci &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Base de datos: Supabase (fuera de Render). Pega aqui la URI del POOLER DE
      # SESION (usuario postgres.<ref>, puerto 5432):
      #   postgresql://postgres.<ref>:<pass>@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=no-verify
      # `no-verify` y no `require`: el driver `pg` de Node trata `require` como
      # `verify-full` y la cadena de certificados del pooler de Supabase no es
      # verificable publicamente (falla SELF_SIGNED_CERT_IN_CHAIN). El conector de
      # Prisma si acepta `require`, pero el servidor corre sobre `pg`, asi que va
      # `no-verify` para las dos cosas. Nada de pooler de transacciones (6543):
      # pgbouncer rompe las sentencias preparadas de las migraciones.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 8h
      - key: TRUST_PROXY
        value: '1'
      - key: PG_POOL_MAX
        value: '10'
      # Origenes del front en Vercel. Sin esto el navegador bloquea las llamadas.
      - key: ORIGINES_PERMITIDAS
        sync: false
      # Web Push (opcional; vacio = sin push web)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Asistente con IA (opcional; vacio = busqueda guiada)
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODELO
        sync: false

# Ya no se declara `databases:`: la base vive en Supabase y llega por DATABASE_URL.
# El Postgres free de Render caduca a los 90 dias; la de Supabase no se borra.
